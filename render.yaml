services:
  - type: web
    name: retina-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_DATABASE
        value: retina_ai
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://ai-ratina-kn7w.vercel.app
